<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发票号识别与导出工具</title>
<!-- 1. 引入 PDF.js (用于读取PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- 2. 引入 JSZip (用于打包文件) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- 3. 引入 FileSaver (用于保存文件) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
*{box-sizing:border-box;font-family:微软雅黑}
body{background:#f5f7fa;padding:20px}
.container{max-width:700px;margin:0 auto;background:#fff;padding:25px;border-radius:12px}
h2{color:#2196F3}
.btn{background:#2196F3;color:#fff;border:none;padding:10px 20px;border-radius:6px;margin:5px;cursor:pointer}
.btn:disabled {background: #ccc; cursor: not-allowed;}
#log{background:#f9f9f9;padding:15px;border-radius:8px;height:350px;overflow-y:auto;margin-top:15px;font-size:14px;border:1px solid #eee}
</style>
</head>
<body>
<div class="container">
  <h2>🧾 发票识别与导出工具</h2>
  <p>✅ 读取PDF内容 | ✅ 提取20位发票号 | ✅ 打包下载</p>
  
  <button class="btn" onclick="selectFiles()">选择PDF文件</button>
  <button class="btn" onclick="selectFolder()">选择文件夹</button>
  <button class="btn" onclick="startWork()" id="runBtn">开始识别并导出</button>
  
  <input type="file" id="fileInput" accept=".pdf" multiple style="display:none">
  <input type="file" id="folderInput" webkitdirectory directory style="display:none">
  <div id="log">等待操作...</div>
</div>

<script>
// 配置 PDF.js 的 worker 路径
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let selectedFiles = [];
const logBox = document.getElementById('log');
const runBtn = document.getElementById('runBtn');

function log(msg) {
  logBox.innerHTML += msg + '<br>';
  logBox.scrollTop = logBox.scrollHeight;
}

function selectFiles() {
  fileInput.onchange = e => {
    selectedFiles = Array.from(e.target.files);
    log(`✅ 已选择 ${selectedFiles.length} 个文件`);
  };
  fileInput.click();
}

function selectFolder() {
  folderInput.onchange = e => {
    selectedFiles = Array.from(e.target.files);
    log(`✅ 已加载文件夹中 ${selectedFiles.length} 个文件`);
  };
  folderInput.click();
}

// 核心：从PDF文本或文件名中提取20位数字
async function extractInvoiceNumber(file) {
    // 1. 尝试读取PDF内容
    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        // 只读取第一页，通常发票号都在第一页
        const page = await pdf.getPage(1);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        
        // 正则匹配20位数字 (发票号码)
        const match = pageText.match(/\d{20}/);
        if (match) return match[0];
    } catch (e) {
        console.error("PDF读取错误", e);
    }

    // 2. 如果PDF读取失败或没找到，回退到从文件名提取
    const nameMatch = file.name.match(/\d{20}/);
    if (nameMatch) return nameMatch[0];

    // 3. 最终回退：清理文件名
    return file.name.replace('.pdf', '').replace(/[^a-zA-Z0-9]/g, '_');
}

async function startWork() {
  if (selectedFiles.length === 0) {
    alert("请先选择文件！");
    return;
  }

  runBtn.disabled = true;
  runBtn.innerText = "处理中...";
  logBox.innerHTML = "";
  log("🚀 开始识别并准备导出...");

  // 创建一个新的 ZIP 包
  const zip = new JSZip();

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    
    // 获取发票号
    const newFileName = await extractInvoiceNumber(file) + ".pdf";
    
    // 读取文件二进制数据
    const fileData = await file.arrayBuffer();
    
    // 将文件添加到 ZIP 中，使用新文件名
    zip.file(newFileName, fileData);
    
    log(`[${i+1}/${selectedFiles.length}] ${file.name} ➔ <b>${newFileName}</b>`);
  }

  log("<br>📦 正在生成压缩包，请稍候...");

  // 生成并下载 ZIP
  zip.generateAsync({type:"blob"}).then(function(content) {
      saveAs(content, "发票重命名导出.zip");
      log("🎉 下载已开始！");
      runBtn.disabled = false;
      runBtn.innerText = "开始识别并导出";
  });
}
</script>
</body>
</html>
